<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DM Gaming News - Der maximale Drift!</title>
    <link rel="icon" type="image/png" href="favicon.png.png">
    <style>
        :root {
            --neon-purple: #bd00ff;
            --neon-cyan: #00f0ff;
            --text-gold: #ffcc00;
            --text-white: #ffffff;
            --panel-bg: rgba(14, 10, 20, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            color: var(--text-white);
            background: radial-gradient(circle at 5% 30%, rgba(147, 51, 234, 0.25), transparent 40%),
                        radial-gradient(circle at 95% 70%, rgba(147, 51, 234, 0.25), transparent 40%),
                        linear-gradient(125deg, #0b0c10, #1f0033, #002b3d, #0b0c10);
            background-size: 400% 400%;
            animation: space-drift 15s ease infinite;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        @keyframes space-drift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- OBERE NAVIGATIONSLEISTE (HEADER) --- */
        .main-header {
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(10, 11, 14, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 2px solid var(--neon-purple);
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-logo img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .nav-logo span {
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-white);
            text-shadow: 0 0 10px var(--neon-purple);
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-item {
            color: var(--text-white);
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            padding: 6px 12px;
            border-radius: 4px;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            background: rgba(0, 240, 255, 0.1);
        }

        /* --- DEIN GELIEBTES ORIGINAL-GRID LAYOUT --- */
        .dashboard-container {
            max-width: 1450px;
            margin: 110px auto 40px auto;
            padding: 0 25px;
            display: grid;
            grid-template-columns: 2.2fr 1.1fr;
            gap: 30px;
        }

        @media (max-width: 1024px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }
        }

        /* --- LINKER BEREICH: HAUPTVIDEO-BLOCK & SOCIALS --- */
        .main-content-block {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .main-video-card {
            background: var(--panel-bg);
            border: 2px solid var(--neon-purple);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(189, 0, 255, 0.25);
            backdrop-filter: blur(10px);
        }

        .video-thumbnail-container {
            width: 100%;
            height: 440px;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        @media (max-width: 768px) {
            .video-thumbnail-container { height: 260px; }
        }

        .video-description {
            padding: 30px;
        }

        .video-description .tag {
            background: rgba(189, 0, 255, 0.25);
            color: #e066ff;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 4px;
            border: 1px solid var(--neon-purple);
            display: inline-block;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .video-description h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .video-description p {
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.6;
            font-size: 15px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .drift-button {
            display: block;
            width: 100%;
            padding: 18px;
            background: var(--panel-bg);
            border: 2px solid var(--neon-purple);
            border-radius: 10px;
            color: var(--text-white);
            text-decoration: none;
            font-weight: 700;
            text-align: center;
            font-size: 16px;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .drift-button:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        /* --- RECHTER BEREICH: NEWS SIDEBAR (DIE ORIGINALEN KASTEN) --- */
        .side-news-block {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .side-news-block h2 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1.5px;
            border-left: 4px solid var(--neon-cyan);
            padding-left: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            margin-bottom: 5px;
        }

        .grid-card {
            background: var(--panel-bg);
            border: 2px solid rgba(189, 0, 255, 0.3);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column; /* Wieder zurück auf untereinander gestapelt! */
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .grid-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
        }

        .card-thumbnail {
            width: 100%;
            height: 160px;
            background-size: cover;
            background-position: center;
            border-bottom: 2px solid rgba(189, 0, 255, 0.2);
        }

        .card-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-tag {
            align-self: flex-start;
            background: rgba(0, 240, 255, 0.1);
            color: var(--neon-cyan);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--neon-cyan);
            letter-spacing: 0.5px;
        }

        .card-content h3 {
            color: var(--text-white);
            font-size: 15px;
            font-weight: 700;
            line-height: 1.4;
        }

        /* --- LIVE NEWS TICKER UNTEN --- */
        .ticker-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #000000;
            border-top: 3px solid var(--neon-cyan);
            padding: 14px 0;
            z-index: 2000;
            overflow: hidden;
            box-shadow: 0 -5px 25px rgba(0, 240, 255, 0.3);
        }

        .ticker-text {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: ticker-drift 30s linear infinite;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            color: var(--text-white);
        }

        .ticker-text span {
            color: var(--text-gold);
            text-shadow: 0 0 8px var(--text-gold);
        }

        @keyframes ticker-drift {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>

            <a href="#news" class="nav-item">News</a>
            <a href="#videos" class="nav-item">Videos</a>
            <a href="#merch" class="nav-item">Merch</a>
        </nav>
    </header>
